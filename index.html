<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT-ENNUI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #000; height: 100%; overflow: hidden; user-select: none; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
(function () {
'use strict';

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
var N   = 128;   // world grid side (heightmap is N×N)
var FPX = 13;    // font size px
var CW  = 8;     // cell width  (re-measured after font load)
var CH  = 15;    // cell height
var COLS = 100, ROWS = 40;  // screen grid dimensions (recalculated on resize)

// ─── SEEDED PRNG (xorshift32) ────────────────────────────────────────────────
var _seed = 1;
function srand(v) { _seed = ((v >>> 0) || 1); }
function rand()   {
  _seed ^= _seed << 13;
  _seed ^= _seed >> 17;
  _seed ^= _seed << 5;
  return (_seed >>> 0) / 4294967296;
}

// ─── VALUE NOISE + FBM ───────────────────────────────────────────────────────
function _ss(t)       { return t * t * (3 - 2 * t); }
function _lp(a, b, t) { return a + t * (b - a); }
function vnoise(x, y, s) {
  var ix = x | 0, iy = y | 0;
  var fx = _ss(x - ix), fy = _ss(y - iy);
  var h = function (px, py) {
    var n = Math.sin(px * 127.1 + py * 311.7 + s * 74.3) * 43758.5453;
    return n - Math.floor(n);
  };
  return _lp(_lp(h(ix, iy), h(ix + 1, iy), fx),
             _lp(h(ix, iy + 1), h(ix + 1, iy + 1), fx), fy);
}
function fbm(x, y, s, octs) {
  octs = octs || 7;
  var v = 0, a = 0.5, f = 1, t = 0;
  for (var i = 0; i < octs; i++) {
    v += vnoise(x * f, y * f, s + i * 97) * a;
    t += a; a *= 0.5; f *= 2.1;
  }
  return v / t;
}

// ─── WORLD DATA ──────────────────────────────────────────────────────────────
// hmap   – elevation   0..1  (world-space heightfield)
// fogmap – fog density 0..1  (world-space; future-proof for fog-of-war reveal)
//   Architecture note: fogmap stores the BASE atmospheric fog.
//   A future reveal mechanic would track an explored[] boolean grid separately
//   and composite: visibleFog = explored[i] ? fogmap[i] : 1.0
var hmap   = new Float32Array(N * N);
var fogmap = new Float32Array(N * N);
var curSeed = 0;

function genWorld(seed) {
  curSeed = seed;
  srand(seed);

  // Central summit + random secondary peaks
  var peaks = [{ x: N / 2, z: N / 2, h: 1.0, r: N * 0.28 }];
  for (var i = 0; i < 5; i++) {
    peaks.push({
      x: rand() * N * 0.6 + N * 0.2,
      z: rand() * N * 0.6 + N * 0.2,
      h: rand() * 0.52 + 0.28,
      r: rand() * N * 0.13 + N * 0.06
    });
  }

  for (var zi = 0; zi < N; zi++) {
    for (var xi = 0; xi < N; xi++) {
      var base = fbm(xi / N * 5, zi / N * 5, seed) * 0.28;
      var pk = 0;
      for (var pi = 0; pi < peaks.length; pi++) {
        var ddx = (xi - peaks[pi].x) / peaks[pi].r;
        var ddz = (zi - peaks[pi].z) / peaks[pi].r;
        var tt = Math.max(0, 1 - (ddx * ddx + ddz * ddz));
        pk = Math.max(pk, tt * tt * peaks[pi].h);
      }
      hmap[zi * N + xi] = Math.min(1, Math.max(0, base + pk));
    }
  }

  // Fog: dense in basins (inversely proportional to elevation),
  // with spatial fbm variation for rolling/patchy appearance.
  for (var zi2 = 0; zi2 < N; zi2++) {
    for (var xi2 = 0; xi2 < N; xi2++) {
      var hv = hmap[zi2 * N + xi2];
      var basin = Math.max(0, 1 - hv * 3.5) * 0.72;
      var vary  = fbm(xi2 / N * 4 + 11.3, zi2 / N * 4 + 7.1, seed + 500, 4)
                  * 0.35 * Math.max(0, 1 - hv * 1.8);
      fogmap[zi2 * N + xi2] = Math.min(1, basin + vary);
    }
  }
}

// Bilinear sampler for heightmap
function sh(wx, wz) {
  wx = Math.max(0, Math.min(N - 1.001, wx));
  wz = Math.max(0, Math.min(N - 1.001, wz));
  var ix = wx | 0, iz = wz | 0;
  var fx = wx - ix, fz = wz - iz;
  var i00 = iz * N + ix;
  return hmap[i00]         * (1 - fx) * (1 - fz)
       + hmap[i00 + 1]     * fx       * (1 - fz)
       + hmap[i00 + N]     * (1 - fx) * fz
       + hmap[i00 + N + 1] * fx       * fz;
}

// Bilinear sampler for fogmap
function sfog(wx, wz) {
  wx = Math.max(0, Math.min(N - 1.001, wx));
  wz = Math.max(0, Math.min(N - 1.001, wz));
  var ix = wx | 0, iz = wz | 0;
  var fx = wx - ix, fz = wz - iz;
  var i00 = iz * N + ix;
  return fogmap[i00]         * (1 - fx) * (1 - fz)
       + fogmap[i00 + 1]     * fx       * (1 - fz)
       + fogmap[i00 + N]     * (1 - fx) * fz
       + fogmap[i00 + N + 1] * fx       * fz;
}

// ─── TERRAIN ZONES ───────────────────────────────────────────────────────────
var ZONES = [
  { max: 0.06, g: '~', r: 38,  gv: 70,  b: 118 },  // water / deep valley
  { max: 0.15, g: '.', r: 50,  gv: 93,  b: 52  },  // lowland
  { max: 0.27, g: ',', r: 66,  gv: 115, b: 46  },  // meadow
  { max: 0.40, g: 'T', r: 40,  gv: 85,  b: 33  },  // forest
  { max: 0.53, g: ';', r: 98,  gv: 88,  b: 60  },  // scrub / heather
  { max: 0.66, g: '+', r: 128, gv: 116, b: 80  },  // rocky
  { max: 0.80, g: '#', r: 150, gv: 141, b: 131 },  // cliff
  { max: 0.92, g: '^', r: 193, gv: 190, b: 183 },  // peak
  { max: 1.01, g: '*', r: 226, gv: 230, b: 236 }   // snow summit
];
function zoneOf(h) {
  for (var i = 0; i < ZONES.length; i++) if (h <= ZONES[i].max) return ZONES[i];
  return ZONES[ZONES.length - 1];
}

// ─── CAMERA ──────────────────────────────────────────────────────────────────
var camAngle   = 0.4;   // orbit angle (radians)
var camZoom    = 1.0;   // zoom factor  0.35 … 3.0
var autoRotate = false;
var ROT_STEP   = Math.PI / 12;   // 15° per manual key press
var AUTO_RATE  = 0.00045;        // rad / ms  (smooth auto-rotate)

// ─── CANVAS ──────────────────────────────────────────────────────────────────
var canvas, ctx;
function initCanvas() {
  canvas = document.getElementById('gc');
  ctx    = canvas.getContext('2d');
  resize();
}
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.font = FPX + 'px "Courier New", monospace';
  CW   = Math.ceil(ctx.measureText('M').width);
  CH   = Math.ceil(FPX * 1.32);
  COLS = Math.max(20, Math.floor(canvas.width  / CW));
  ROWS = Math.max(10, Math.floor(canvas.height / CH));
}

// ─── GRAIN RNG (fast xorshift, separate from world PRNG) ─────────────────────
var _gs = 1;
function gr() {
  _gs ^= _gs << 13; _gs ^= _gs >> 17; _gs ^= _gs << 5;
  return (_gs >>> 0) / 4294967296;
}

// ─── RENDERING ───────────────────────────────────────────────────────────────
var fogT = 0;   // increases over time; drives rolling fog animation

function render(ts) {
  if (!ctx) return;
  fogT = ts * 0.00022;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = FPX + 'px "Courier New", monospace';
  ctx.textBaseline = 'top';

  // Camera direction vectors (orthographic orbit)
  var fX = Math.cos(camAngle), fZ = Math.sin(camAngle);  // forward (into scene)
  var rX = -fZ,                rZ = fX;                   // right (lateral)
  var cx = N * 0.5,            cz = N * 0.5;              // world centre

  // View geometry (world units)
  var halfW = (N * 0.52) / camZoom;   // lateral half-width
  var halfD = N * 0.62;               // depth half-range along forward axis
  var step  = 0.80;                   // world-unit step for depth march

  // Layout: a few rows of sky at top, ground strip at bottom
  var SKY  = Math.max(2, Math.round(ROWS * 0.08));
  var GND  = ROWS - 2;
  var HROW = GND - SKY;    // rows available for terrain height mapping

  // Reseed grain per frame so it animates (film-grain feel)
  _gs = ((ts * 7919 + 0xBEEF) | 1) >>> 0;

  // ── Per-column pre-scan ──────────────────────────────────────────────────
  // For each screen column we march along the forward axis and record:
  //   maxH        – silhouette height (0..1)
  //   depthAtMax  – depth value d where maxH was found (near=-halfD, far=+halfD)
  //   fogAtMax    – fog density at the silhouette point
  //   avgFogLow   – mean fog in the valley band (h < 0.28), for fog-layer rendering
  var colMaxH   = new Float32Array(COLS);
  var colDepth  = new Float32Array(COLS);
  var colFogMax = new Float32Array(COLS);
  var colFogLow = new Float32Array(COLS);

  for (var c = 0; c < COLS; c++) {
    var lat = (c / (COLS - 1) - 0.5) * 2 * halfW;
    var bx  = cx + lat * rX;
    var bz  = cz + lat * rZ;

    var maxH = 0, depthAtMax = 0, fogAtMax = 0, fogLowSum = 0, fogLowCnt = 0;

    for (var d = -halfD; d <= halfD; d += step) {
      var wx = bx + d * fX, wz = bz + d * fZ;
      if (wx < 0 || wx >= N || wz < 0 || wz >= N) continue;

      var hv = sh(wx, wz);
      // Animated fog offset: gentle sinusoidal drift for rolling-fog effect
      var fwx = wx + Math.cos(fogT + wz * 0.05) * 5.5;
      var fwz = wz + Math.sin(fogT * 0.72 + wx * 0.04) * 4.5;
      var fv  = sfog(fwx, fwz);

      if (hv > maxH) { maxH = hv; depthAtMax = d; fogAtMax = fv; }
      if (hv < 0.28) { fogLowSum += fv; fogLowCnt++; }
    }

    colMaxH[c]   = maxH;
    colDepth[c]  = depthAtMax;
    colFogMax[c] = fogAtMax;
    colFogLow[c] = fogLowCnt > 0 ? fogLowSum / fogLowCnt : 0;
  }

  // ── Per-cell rendering ───────────────────────────────────────────────────
  for (var c2 = 0; c2 < COLS; c2++) {
    var px       = c2 * CW;
    var maxH2    = colMaxH[c2];
    var df       = (colDepth[c2] + halfD) / (2 * halfD);  // 0=near, 1=far
    var fogMax2  = colFogMax[c2];
    var fogLow2  = colFogLow[c2];
    var peakRow  = SKY + Math.round((1 - maxH2) * HROW);  // silhouette row

    for (var r = 0; r < ROWS; r++) {
      var py = r * CH;

      // ── Sky rows ──
      if (r < SKY) {
        if (gr() < 0.010) {
          var sv = 18 + (gr() * 12 | 0);
          ctx.fillStyle = 'rgb(' + sv + ',' + sv + ',' + (sv + 7) + ')';
          ctx.fillText('`', px, py);
        }
        continue;
      }

      // ── Ground strip ──
      if (r >= GND) {
        ctx.fillStyle = 'rgb(20,24,20)';
        ctx.fillText(gr() < 0.55 ? '_' : '.', px, py);
        continue;
      }

      // Altitude this row represents (1=summit, 0=valley floor)
      var rowAlt = 1 - (r - SKY) / HROW;

      // ── Air above terrain silhouette ──
      if (r < peakRow) {
        // Sparse background grain
        if (gr() < 0.017) {
          var av = 16 + (gr() * 11 | 0);
          ctx.fillStyle = 'rgb(' + av + ',' + av + ',' + (av + 6) + ')';
          ctx.fillText('.', px, py);
        }
        // Rolling valley fog tendrils that bleed upward into lower air
        if (rowAlt < 0.30 && fogLow2 > 0.25) {
          var fd = (fogLow2 - 0.25) / 0.75 * (0.30 - rowAlt) / 0.30;
          fd = fd * fd;   // sharpen gradient near silhouette
          if (gr() < fd * 0.52) {
            var fv2 = 52 + (fd * 88 | 0);
            ctx.fillStyle = 'rgb(' + fv2 + ',' + (fv2 + 5) + ',' + (fv2 + 20) + ')';
            ctx.fillText(gr() < 0.45 ? '~' : '-', px, py);
          }
        }
        continue;
      }

      // ── Terrain ──
      var z   = zoneOf(rowAlt);
      var shd = 1.0 - df * 0.50;  // depth shading: near=bright, far=dark

      // Fog blends terrain toward a blue-grey haze.
      // Silhouette row: max 25% fog (always readable).
      // Sub-silhouette rows: more fog allowed deeper into scene.
      // Hard cap at 0.68 so terrain never disappears into flat grey.
      var fb = (r === peakRow) ? fogMax2 * 0.25 : fogMax2 * df * 0.58;
      fb = Math.min(0.68, fb);

      var cr = z.r * shd,  cg = z.gv * shd,  cb = z.b * shd;
      cr = cr + (92  - cr) * fb;
      cg = cg + (100 - cg) * fb;
      cb = cb + (128 - cb) * fb;

      // Choose glyph: silhouette row shows zone char; fill rows show texture
      var glyph;
      if (r === peakRow) {
        glyph = z.g;
      } else {
        var band = r - peakRow;
        glyph = band <= 1 ? z.g : ((c2 + r) & 3) < 1 ? ':' : '|';
      }

      ctx.fillStyle = 'rgb(' + (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0) + ')';
      ctx.fillText(glyph, px, py);

      // Valley fog layer: overlays low-altitude terrain cells
      if (rowAlt < 0.22 && fogLow2 > 0.30) {
        var fld = Math.min(0.72, (fogLow2 - 0.30) * (0.22 - rowAlt) / 0.22 * 1.9);
        if (gr() < fld) {
          var flv = 60 + (fld * 100 | 0);
          ctx.fillStyle = 'rgba(' + flv + ',' + (flv + 6) + ',' + (flv + 24) + ',0.88)';
          ctx.fillText(gr() < 0.38 ? '~' : (gr() < 0.55 ? '-' : '='), px, py);
        }
      }
    }
  }

  drawHUD();
}

function drawHUD() {
  var HH = CH + 2;
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, canvas.width, HH);
  ctx.fillRect(0, canvas.height - HH, canvas.width, HH);

  ctx.font = Math.round(FPX * 0.87) + 'px "Courier New", monospace';
  ctx.textBaseline = 'top';

  var deg = ((camAngle * 180 / Math.PI) % 360 + 360) % 360 | 0;
  ctx.fillStyle = '#4c5f80';
  ctx.fillText(
    'MT-ENNUI' +
    '   SEED:' + curSeed +
    '   \u2220' + deg + '\u00b0' +
    '   zoom:' + camZoom.toFixed(2) +
    (autoRotate ? '   [AUTO]' : ''),
    8, 4
  );

  ctx.fillStyle = '#374858';
  ctx.textBaseline = 'bottom';
  ctx.fillText(
    'Q/E \u25c4\u25ba Rotate    A Auto-rotate    Z/X Zoom    R New seed',
    8, canvas.height - 4
  );
}

// ─── ANIMATION LOOP ──────────────────────────────────────────────────────────
var prevTs = 0;
function loop(ts) {
  var dt = ts - prevTs;
  if (dt < 0 || dt > 200) dt = 16;
  prevTs = ts;

  if (autoRotate) camAngle += AUTO_RATE * dt;

  render(ts);
  requestAnimationFrame(loop);
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function (e) {
  switch (e.key) {
    case 'q': case 'Q': case 'ArrowLeft':  camAngle -= ROT_STEP; break;
    case 'e': case 'E': case 'ArrowRight': camAngle += ROT_STEP; break;
    case 'a': case 'A': autoRotate = !autoRotate; break;
    case 'z': case 'Z': camZoom = Math.min(3.0, camZoom + 0.15); break;
    case 'x': case 'X': camZoom = Math.max(0.35, camZoom - 0.15); break;
    case 'r': case 'R': genWorld(Math.floor(Math.random() * 999983) + 1); break;
    default: return;
  }
  e.preventDefault();
});

// ─── BOOT ────────────────────────────────────────────────────────────────────
window.addEventListener('load', function () {
  initCanvas();
  genWorld(Math.floor(Math.random() * 999983) + 1);
  requestAnimationFrame(loop);
});

window.addEventListener('resize', function () {
  resize();
});

})();
</script>
</body>
</html>
