<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT-ENNUI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #000; height: 100%; overflow: hidden; user-select: none; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
(function () {
'use strict';

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
var N = 128;   // world grid side (heightmap is N×N)

// ─── SEEDED PRNG (xorshift32) ────────────────────────────────────────────────
var _seed = 1;
function srand(v) { _seed = ((v >>> 0) || 1); }
function rand()   {
  _seed ^= _seed << 13;
  _seed ^= _seed >> 17;
  _seed ^= _seed << 5;
  return (_seed >>> 0) / 4294967296;
}

// ─── VALUE NOISE + FBM ───────────────────────────────────────────────────────
function _ss(t)       { return t * t * (3 - 2 * t); }
function _lp(a, b, t) { return a + t * (b - a); }
function vnoise(x, y, s) {
  var ix = x | 0, iy = y | 0;
  var fx = _ss(x - ix), fy = _ss(y - iy);
  var h = function (px, py) {
    var n = Math.sin(px * 127.1 + py * 311.7 + s * 74.3) * 43758.5453;
    return n - Math.floor(n);
  };
  return _lp(_lp(h(ix, iy), h(ix + 1, iy), fx),
             _lp(h(ix, iy + 1), h(ix + 1, iy + 1), fx), fy);
}
function fbm(x, y, s, octs) {
  octs = octs || 7;
  var v = 0, a = 0.5, f = 1, t = 0;
  for (var i = 0; i < octs; i++) {
    v += vnoise(x * f, y * f, s + i * 97) * a;
    t += a; a *= 0.5; f *= 2.1;
  }
  return v / t;
}

// ─── WORLD DATA ──────────────────────────────────────────────────────────────
// hmap   – elevation   0..1  (world-space heightfield)
// fogmap – fog density 0..1  (world-space; future-proof for fog-of-war reveal)
//   Architecture note: fogmap stores the BASE atmospheric fog.
//   A future reveal mechanic would track an explored[] boolean grid separately
//   and composite: visibleFog = explored[i] ? fogmap[i] : 1.0
var hmap   = new Float32Array(N * N);
var fogmap = new Float32Array(N * N);
var curSeed = 0;

function genWorld(seed) {
  curSeed = seed;
  srand(seed);

  // Central summit + random secondary peaks
  var peaks = [{ x: N / 2, z: N / 2, h: 1.0, r: N * 0.28 }];
  for (var i = 0; i < 5; i++) {
    peaks.push({
      x: rand() * N * 0.6 + N * 0.2,
      z: rand() * N * 0.6 + N * 0.2,
      h: rand() * 0.52 + 0.28,
      r: rand() * N * 0.13 + N * 0.06
    });
  }

  for (var zi = 0; zi < N; zi++) {
    for (var xi = 0; xi < N; xi++) {
      var base = fbm(xi / N * 5, zi / N * 5, seed) * 0.28;
      var pk = 0;
      for (var pi = 0; pi < peaks.length; pi++) {
        var ddx = (xi - peaks[pi].x) / peaks[pi].r;
        var ddz = (zi - peaks[pi].z) / peaks[pi].r;
        var tt = Math.max(0, 1 - (ddx * ddx + ddz * ddz));
        pk = Math.max(pk, tt * tt * peaks[pi].h);
      }
      hmap[zi * N + xi] = Math.min(1, Math.max(0, base + pk));
    }
  }

  // Fog: dense in basins (inversely proportional to elevation),
  // with spatial fbm variation for rolling/patchy appearance.
  for (var zi2 = 0; zi2 < N; zi2++) {
    for (var xi2 = 0; xi2 < N; xi2++) {
      var hv = hmap[zi2 * N + xi2];
      var basin = Math.max(0, 1 - hv * 3.5) * 0.72;
      var vary  = fbm(xi2 / N * 4 + 11.3, zi2 / N * 4 + 7.1, seed + 500, 4)
                  * 0.35 * Math.max(0, 1 - hv * 1.8);
      fogmap[zi2 * N + xi2] = Math.min(1, basin + vary);
    }
  }
}

// Bilinear sampler for heightmap
function sh(wx, wz) {
  wx = Math.max(0, Math.min(N - 1.001, wx));
  wz = Math.max(0, Math.min(N - 1.001, wz));
  var ix = wx | 0, iz = wz | 0;
  var fx = wx - ix, fz = wz - iz;
  var i00 = iz * N + ix;
  return hmap[i00]         * (1 - fx) * (1 - fz)
       + hmap[i00 + 1]     * fx       * (1 - fz)
       + hmap[i00 + N]     * (1 - fx) * fz
       + hmap[i00 + N + 1] * fx       * fz;
}

// Bilinear sampler for fogmap
function sfog(wx, wz) {
  wx = Math.max(0, Math.min(N - 1.001, wx));
  wz = Math.max(0, Math.min(N - 1.001, wz));
  var ix = wx | 0, iz = wz | 0;
  var fx = wx - ix, fz = wz - iz;
  var i00 = iz * N + ix;
  return fogmap[i00]         * (1 - fx) * (1 - fz)
       + fogmap[i00 + 1]     * fx       * (1 - fz)
       + fogmap[i00 + N]     * (1 - fx) * fz
       + fogmap[i00 + N + 1] * fx       * fz;
}

// ─── COLOR RAMP (pre-computed 256-entry lookup table) ────────────────────────
// elevation 0=valley → 1=snow peak, smoothly interpolated
var _RAMP_N = 256;
var _RAMP   = new Uint8Array(_RAMP_N * 3);
(function () {
  // [elevation_stop, r, g, b]
  var stops = [
    [0.00,  24,  45,  85],   // deep shadow / water
    [0.05,  38,  70, 110],   // valley bottom
    [0.12,  50,  93,  52],   // lowland grass
    [0.22,  66, 115,  46],   // meadow
    [0.35,  40,  85,  33],   // forest
    [0.46,  86,  78,  50],   // scrub / heath
    [0.58, 128, 116,  80],   // rocky
    [0.72, 150, 141, 131],   // cliff
    [0.86, 193, 190, 183],   // peak
    [1.00, 230, 234, 240]    // snow summit
  ];
  for (var i = 0; i < _RAMP_N; i++) {
    var h = i / (_RAMP_N - 1), si = 1;
    while (si < stops.length - 1 && h > stops[si][0]) si++;
    var lo = stops[si - 1], hi = stops[si];
    var tt = (lo[0] === hi[0]) ? 0 : (h - lo[0]) / (hi[0] - lo[0]);
    tt = tt * tt * (3 - 2 * tt); // smoothstep
    _RAMP[i * 3]     = (lo[1] + tt * (hi[1] - lo[1])) | 0;
    _RAMP[i * 3 + 1] = (lo[2] + tt * (hi[2] - lo[2])) | 0;
    _RAMP[i * 3 + 2] = (lo[3] + tt * (hi[3] - lo[3])) | 0;
  }
}());

// ─── CAMERA ──────────────────────────────────────────────────────────────────
var camAngle   = 0.4;   // orbit angle (radians)
var camZoom    = 1.0;   // zoom factor  0.35 … 3.0
var autoRotate = false;
var ROT_STEP   = Math.PI / 12;   // 15° per manual key press
var AUTO_RATE  = 0.00045;        // rad / ms  (smooth auto-rotate)

// ─── CANVAS ──────────────────────────────────────────────────────────────────
// Two-layer approach:
//   offscreen – half-res pixel buffer for terrain (cheap putImageData)
//   canvas    – full-res main canvas: receives scaled terrain + HUD text
var canvas, ctx;
var offscreen, offCtx;
var PW = 1, PH = 1;   // offscreen pixel dimensions

function initCanvas() {
  canvas    = document.getElementById('gc');
  ctx       = canvas.getContext('2d');
  offscreen = document.createElement('canvas');
  offCtx    = offscreen.getContext('2d');
  resize();
}
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  PW = Math.max(1, canvas.width  >> 1);  // half screen → upscaled 2× for terrain
  PH = Math.max(1, canvas.height >> 1);
  offscreen.width  = PW;
  offscreen.height = PH;
  _imgData = null;   // force ImageData recreate next frame
}

// ─── GRAIN RNG (fast xorshift, separate from world PRNG) ─────────────────────
var _gs = 1;
function gr() {
  _gs ^= _gs << 13; _gs ^= _gs >> 17; _gs ^= _gs << 5;
  return (_gs >>> 0) / 4294967296;
}

// ─── RENDERING ───────────────────────────────────────────────────────────────
var fogT     = 0;
var _imgData = null;   // reused ImageData

function render(ts) {
  if (!ctx) return;
  fogT = ts * 0.00022;

  var W = PW, H = PH;

  // Allocate (or reuse) the ImageData pixel buffer
  if (!_imgData || _imgData.width !== W || _imgData.height !== H) {
    _imgData = offCtx.createImageData(W, H);
  }
  var buf = _imgData.data;

  // Camera direction vectors (orthographic orbit)
  var fX = Math.cos(camAngle), fZ = Math.sin(camAngle);
  var rX = -fZ,                rZ = fX;
  var cx = N * 0.5,            cz = N * 0.5;

  // View geometry (world units)
  var halfW = (N * 0.52) / camZoom;
  var halfD = N * 0.62;
  var step  = 1.5;   // world-unit depth step

  // Screen layout (pixel rows in the half-res buffer)
  var skyH  = Math.max(2, (H * 0.09) | 0);
  var gndY  = H - Math.max(2, (H * 0.025) | 0);
  var terrH = gndY - skyH;

  // ── Per-column pre-scan ──────────────────────────────────────────────────
  var colMaxH   = new Float32Array(W);
  var colDepth  = new Float32Array(W);
  var colFogMax = new Float32Array(W);
  var colFogLow = new Float32Array(W);
  var colRim    = new Float32Array(W);  // lateral slope shading

  for (var c = 0; c < W; c++) {
    var lat = (c / (W - 1) - 0.5) * 2 * halfW;
    var bx  = cx + lat * rX, bz = cz + lat * rZ;

    var maxH = 0, depthAtMax = 0, fogAtMax = 0, fogLowSum = 0, fogLowCnt = 0;

    for (var d = -halfD; d <= halfD; d += step) {
      var wx = bx + d * fX, wz = bz + d * fZ;
      if (wx < 0 || wx >= N || wz < 0 || wz >= N) continue;

      var hv  = sh(wx, wz);
      var fwx = wx + Math.cos(fogT + wz * 0.05) * 5.5;
      var fwz = wz + Math.sin(fogT * 0.72 + wx * 0.04) * 4.5;
      var fv  = sfog(fwx, fwz);

      if (hv > maxH) { maxH = hv; depthAtMax = d; fogAtMax = fv; }
      if (hv < 0.28) { fogLowSum += fv; fogLowCnt++; }
    }

    colMaxH[c]   = maxH;
    colDepth[c]  = depthAtMax;
    colFogMax[c] = fogAtMax;
    colFogLow[c] = fogLowCnt > 0 ? fogLowSum / fogLowCnt : 0;
  }

  // Lateral slope shading: left-lit (leftward slope = brighter)
  for (var cc = 0; cc < W; cc++) {
    var lh = cc > 0     ? colMaxH[cc - 1] : colMaxH[cc];
    var rh = cc < W - 1 ? colMaxH[cc + 1] : colMaxH[cc];
    colRim[cc] = (lh - rh) * 2.2;   // +ve = left face lit, −ve = right face shadowed
  }

  // ── Per-pixel rendering ──────────────────────────────────────────────────
  _gs = ((ts * 7919 + 0xBEEF) | 1) >>> 0;  // reseed grain per frame

  for (var y = 0; y < H; y++) {
    var yW = y * W;

    for (var x = 0; x < W; x++) {
      var idx = (yW + x) << 2;

      var maxH2 = colMaxH[x];
      var df    = (colDepth[x] + halfD) / (2 * halfD);  // 0=near, 1=far
      var fogM  = colFogMax[x];
      var fogL  = colFogLow[x];
      var peakY = (skyH + (1 - maxH2) * terrH) | 0;

      var cr, cg, cb;

      if (y < skyH) {
        // ── Sky gradient ──
        var st = y / skyH;
        cr = ( 3 + st * 10) | 0;
        cg = ( 4 + st *  8) | 0;
        cb = (10 + st * 24) | 0;

      } else if (y >= gndY) {
        // ── Ground strip ──
        cr = 14; cg = 18; cb = 14;

      } else if (y < peakY) {
        // ── Air above terrain silhouette ──
        var rowAlt = 1 - (y - skyH) / terrH;
        cr = 3; cg = 4; cb = 9;
        // Valley fog bleeds upward into low-altitude air
        if (rowAlt < 0.30 && fogL > 0.25) {
          var fd = ((fogL - 0.25) / 0.75) * ((0.30 - rowAlt) / 0.30);
          fd = fd * fd;
          if (fd > 0.02) {
            var fv2 = (50 + fd * 80) | 0;
            cr = (_lp(cr, fv2,      fd * 0.65)) | 0;
            cg = (_lp(cg, fv2 + 4,  fd * 0.65)) | 0;
            cb = (_lp(cb, fv2 + 20, fd * 0.65)) | 0;
          }
        }

      } else {
        // ── Terrain ──
        var rowAlt2 = 1 - (y - skyH) / terrH;

        // Color from pre-computed ramp (smooth elevation gradient)
        var ri  = Math.min(_RAMP_N - 1, (rowAlt2 * _RAMP_N) | 0);
        var tcr = _RAMP[ri * 3], tcg = _RAMP[ri * 3 + 1], tcb = _RAMP[ri * 3 + 2];

        // Shading: depth dimming + lateral slope rim light
        var shd = Math.max(0.18, Math.min(1.5, (1.0 - df * 0.48) + colRim[x] * 0.5));

        // Fog blend toward haze colour (88, 96, 124)
        var fb;
        if (y === peakY) {
          shd += 0.18;  // rim glow at silhouette edge
          fb   = fogM * 0.22;
        } else {
          fb = Math.min(0.68, fogM * df * 0.60);
        }

        cr = (_lp(tcr * shd,  88, fb)) | 0;
        cg = (_lp(tcg * shd,  96, fb)) | 0;
        cb = (_lp(tcb * shd, 124, fb)) | 0;

        // Valley fog overlay on low-altitude terrain cells
        if (rowAlt2 < 0.22 && fogL > 0.30) {
          var fld = Math.min(0.72, (fogL - 0.30) * (0.22 - rowAlt2) / 0.22 * 1.9);
          var flv = (55 + fld * 95) | 0;
          cr = (_lp(cr, flv,      fld * 0.72)) | 0;
          cg = (_lp(cg, flv + 5,  fld * 0.72)) | 0;
          cb = (_lp(cb, flv + 22, fld * 0.72)) | 0;
        }
      }

      // Subtle film grain applied to every pixel
      var gn = ((gr() * 12 - 6) | 0);
      buf[idx]     = Math.min(255, Math.max(0, cr + gn));
      buf[idx + 1] = Math.min(255, Math.max(0, cg + gn));
      buf[idx + 2] = Math.min(255, Math.max(0, cb + gn));
      buf[idx + 3] = 255;
    }
  }

  // Write pixel buffer to offscreen, then scale up to main canvas
  offCtx.putImageData(_imgData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

  drawHUD();
}

function drawHUD() {
  var fpx = Math.max(10, (canvas.height * 0.020) | 0);
  var hh  = fpx + 10;
  ctx.font = fpx + 'px "Courier New", monospace';

  // Top bar
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, canvas.width, hh);
  var deg = ((camAngle * 180 / Math.PI) % 360 + 360) % 360 | 0;
  ctx.fillStyle = '#4c5f80';
  ctx.textBaseline = 'top';
  ctx.fillText(
    'MT-ENNUI' +
    '   SEED:' + curSeed +
    '   \u2220' + deg + '\u00b0' +
    '   zoom:' + camZoom.toFixed(2) +
    (autoRotate ? '   [AUTO]' : ''),
    8, 5
  );

  // Bottom bar
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, canvas.height - hh, canvas.width, hh);
  ctx.fillStyle = '#374858';
  ctx.textBaseline = 'bottom';
  ctx.fillText(
    'Q/E \u25c4\u25ba Rotate    A Auto-rotate    Z/X Zoom    R New seed',
    8, canvas.height - 5
  );
}

// ─── ANIMATION LOOP ──────────────────────────────────────────────────────────
var prevTs = 0;
function loop(ts) {
  var dt = ts - prevTs;
  if (dt < 0 || dt > 200) dt = 16;
  prevTs = ts;

  if (autoRotate) camAngle += AUTO_RATE * dt;

  render(ts);
  requestAnimationFrame(loop);
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function (e) {
  switch (e.key) {
    case 'q': case 'Q': case 'ArrowLeft':  camAngle -= ROT_STEP; break;
    case 'e': case 'E': case 'ArrowRight': camAngle += ROT_STEP; break;
    case 'a': case 'A': autoRotate = !autoRotate; break;
    case 'z': case 'Z': camZoom = Math.min(3.0, camZoom + 0.15); break;
    case 'x': case 'X': camZoom = Math.max(0.35, camZoom - 0.15); break;
    case 'r': case 'R': genWorld(Math.floor(Math.random() * 999983) + 1); break;
    default: return;
  }
  e.preventDefault();
});

// ─── BOOT ────────────────────────────────────────────────────────────────────
window.addEventListener('load', function () {
  initCanvas();
  genWorld(Math.floor(Math.random() * 999983) + 1);
  requestAnimationFrame(loop);
});

window.addEventListener('resize', function () {
  resize();
});

})();
</script>
</body>
</html>
